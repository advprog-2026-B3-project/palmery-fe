name: Main GHCR Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Normalize owner name
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            NEXT_PUBLIC_MANAGE_API_BASE_URL=https://api-manage.palmery.my.id
            NEXT_PUBLIC_PAYMENT_API_BASE_URL=https://api-payment.palmery.my.id
            NEXT_PUBLIC_AUTH_FRONTEND_URL=https://auth.palmery.my.id
            NEXT_PUBLIC_APP_CALLBACK_URL=https://palmery.my.id/auth/callback
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/palmery-fe:main
            ghcr.io/${{ steps.owner.outputs.value }}/palmery-fe:main-${{ github.sha }}
